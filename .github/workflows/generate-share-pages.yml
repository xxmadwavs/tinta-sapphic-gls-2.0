name: Generar páginas de compartir (s/ y p/)

on:
  push:
    branches: [main]
    paths:
      - 'data.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generar páginas s/ y p/
        run: python3 generate_share_pages.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add s/ p/
          if git diff --cached --quiet; then
            echo "Sin cambios en s/ o p/"
          else
            git commit -m "chore: regenerar páginas de compartir (s/ y p/)"
            git push
          fi
